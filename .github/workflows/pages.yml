name: Deploy console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd apps/console
      - run: bun run --cwd apps/console build -- --base=/mathzig/
      - name: SPA fallback + nojekyll
        run: |
          cp apps/console/dist/index.html apps/console/dist/404.html
          touch apps/console/dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/console/dist
      - id: deployment
        uses: actions/deploy-pages@v4
